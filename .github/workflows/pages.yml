name: Deploy verified AV Speaker Wiki
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/artifact_hashes.json'
      - 'tests/static_results.json'
      - 'tests/browser_results.json'
      - 'scripts/verify_public.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static artifact
        run: |
          test -f site/index.html
          test -f site/wiki.html
          test -f site/slides.html
          test -f tests/static_results.json
          test -f tests/browser_results.json
          python scripts/verify_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
